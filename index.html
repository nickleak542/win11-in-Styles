<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win11 by Styles</title>
<style>
:root{--bg:#1c1c1f;--glass:rgba(32,32,36,.78);--glass2:rgba(52,52,58,.85);--tx:#fff;--mut:#b4b4bb;--ac:#4cc2ff;--bd:rgba(255,255,255,.1)}
.light{--glass:rgba(243,243,246,.82);--glass2:rgba(255,255,255,.9);--tx:#1b1b1f;--mut:#5b5b63;--ac:#005fb8;--bd:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0}
html,body,#root{height:100%;overflow:hidden}
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--tx);user-select:none}
.desk{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 110%,#0a3d91 0,transparent 55%),radial-gradient(ellipse at 80% 20%,#4cc2ff 0,transparent 45%),linear-gradient(135deg,#0b1d4d,#1b6fd1 55%,#7fd0ff)}
.light.desk{background:radial-gradient(ellipse at 30% 110%,#f6a5c0 0,transparent 55%),radial-gradient(ellipse at 80% 20%,#fff3b0 0,transparent 45%),linear-gradient(135deg,#8fb7ff,#c9d9ff 55%,#ffe3ec)}
.icons{position:absolute;top:8px;left:8px;bottom:56px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);justify-content:start;align-content:start;gap:4px}
.icon{width:84px;padding:8px 4px;text-align:center;font-size:12px;border-radius:6px;color:#fff;text-shadow:0 1px 3px #000a;cursor:default;background:none;border:1px solid transparent}
.icon:hover,.icon:focus-visible{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);outline:none}
.icon b{display:block;font-size:34px;font-weight:400;margin-bottom:2px}
.win{position:absolute;display:flex;flex-direction:column;background:var(--glass2);backdrop-filter:blur(30px);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden;min-width:280px;min-height:160px}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0}
.win.min{display:none}
.tb{display:flex;align-items:center;height:36px;padding-left:12px;font-size:12px;flex:none}
.tb span{flex:1;overflow:hidden;white-space:nowrap}
.tb button{width:46px;height:36px;border:0;background:none;color:var(--tx);font-size:13px}
.tb button:hover{background:var(--bd)}
.tb button.x:hover{background:#c42b1c;color:#fff}
.body{flex:1;overflow:auto;background:var(--glass);display:flex;flex-direction:column;user-select:text}
.tray{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--glass);backdrop-filter:blur(30px);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:4px;z-index:9999}
.tbtn{width:42px;height:40px;border-radius:6px;border:0;background:none;font-size:22px;position:relative;color:var(--tx)}
.tbtn:hover,.tbtn:focus-visible{background:var(--bd);outline:none}
.tbtn.on:after{content:"";position:absolute;bottom:2px;left:50%;width:8px;height:3px;margin-left:-4px;border-radius:2px;background:var(--mut)}
.tbtn.act:after{background:var(--ac);width:16px;margin-left:-8px}
.clock{position:absolute;right:10px;text-align:right;font-size:12px;line-height:1.25;padding:4px 8px;border-radius:6px}
.clock:hover{background:var(--bd)}
.start{position:fixed;left:50%;bottom:60px;width:min(580px,96vw);height:min(620px,calc(100% - 72px));margin-left:calc(min(580px,96vw)/-2);background:var(--glass);backdrop-filter:blur(40px);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:9998;padding:24px;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
@media(prefers-reduced-motion:reduce){.start{animation:none}}
.start input{width:100%;padding:10px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--glass2);color:var(--tx);font:inherit;font-size:14px;margin-bottom:18px;outline:none}
.start input:focus{border-color:var(--ac)}
.start h4{font-size:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.app{padding:12px 4px;text-align:center;font-size:12px;border-radius:6px;border:0;background:none;color:var(--tx)}
.app:hover,.app:focus-visible{background:var(--bd);outline:none}
.app b{display:block;font-size:28px;font-weight:400;margin-bottom:4px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--bd);font-size:13px}
.foot button{border:0;background:none;color:var(--tx);font-size:18px;padding:6px 10px;border-radius:6px}
.foot button:hover{background:var(--bd)}
textarea{flex:1;border:0;outline:0;resize:none;padding:12px;background:transparent;color:var(--tx);font:14px Consolas,monospace;min-height:120px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px;flex:1}
.calc .scr{grid-column:1/-1;text-align:right;font-size:34px;padding:14px 10px;min-height:70px;overflow:hidden}
.calc button{border:0;border-radius:5px;background:var(--glass2);color:var(--tx);font-size:16px;min-height:42px}
.calc button:hover{filter:brightness(1.25)}
.calc .op{background:var(--bd)}.calc .eq{background:var(--ac);color:#fff}
.set{padding:20px;font-size:14px;display:grid;gap:12px;align-content:start}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:6px;background:var(--glass2);border:1px solid var(--bd)}
.sw{width:44px;height:22px;border-radius:11px;border:1px solid var(--mut);background:none;position:relative}
.sw i{position:absolute;top:3px;left:4px;width:14px;height:14px;border-radius:50%;background:var(--mut);transition:left .15s}
.sw.on{background:var(--ac);border-color:var(--ac)}.sw.on i{left:25px;background:#fff}
.about{padding:24px;font-size:14px;line-height:1.6}
.about h2{font-weight:600;margin-bottom:8px}
.store{padding:16px;display:grid;gap:10px;align-content:start}
.store input{padding:9px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--glass2);color:var(--tx);font:inherit;font-size:14px;outline:none}
.store input:focus{border-color:var(--ac)}
.item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:8px;background:var(--glass2);border:1px solid var(--bd)}
.item>b{font-size:32px;font-weight:400}
.item div{flex:1;font-size:13px;color:var(--mut)}.item div strong{display:block;color:var(--tx);font-size:14px;font-weight:600}
.btn{border:1px solid var(--bd);background:var(--glass);color:var(--tx);padding:6px 16px;border-radius:5px;font-size:13px;min-width:84px}
.btn:hover{filter:brightness(1.2)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn:disabled{opacity:.6}
.sw-t{padding:24px;text-align:center}.sw-t .big{font:300 48px Consolas,monospace;margin-bottom:16px}.sw-t .btn{margin:0 4px}
.ttt{display:grid;grid-template-columns:repeat(3,80px);gap:6px;justify-content:center;padding:16px 0}
.ttt button{height:80px;font-size:36px;border:0;border-radius:6px;background:var(--glass2);color:var(--tx)}
.ttt button:hover:not(:disabled){filter:brightness(1.25)}
.pbar{display:flex;gap:6px;padding:8px;align-items:center;flex-wrap:wrap}
.pbar i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;display:inline-block}
.pbar i.sel{border-color:var(--ac)}
canvas{background:#fff;touch-action:none;cursor:crosshair;margin:0 8px 8px;border-radius:4px}
.walls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wp{width:72px;height:46px;border-radius:6px;border:2px solid var(--bd);padding:0}
.wp.sel{border-color:var(--ac)}
.row.col{flex-direction:column;align-items:stretch;gap:12px}
.web{display:flex;flex-direction:column;flex:1;min-height:0}
.web .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:12px;color:var(--mut)}
.web iframe{flex:1;border:0;background:#222;width:100%}
.dragging iframe{pointer-events:none}
.cmd{flex:1;background:#0c0c0c;color:#ccc;font:14px/1.35 Consolas,"Cascadia Mono",monospace;padding:8px;overflow:auto;cursor:text;white-space:pre-wrap;word-break:break-all;user-select:text}
.cl{display:flex}.cl input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;padding:0 0 0 2px}
.menu{position:fixed;z-index:10000;background:var(--glass2);backdrop-filter:blur(30px);border:1px solid var(--bd);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:8px 12px;border-radius:4px;font-size:13px}
.menu button:hover{background:var(--bd)}

.tray.left{justify-content:flex-start;padding-left:8px}
.tray.right{justify-content:flex-end;padding-right:310px}
.tray-controls{position:absolute;right:8px;display:flex;align-items:center;gap:2px}
.tray-pop{position:fixed;right:12px;bottom:58px;z-index:10001;width:280px;padding:16px;border:1px solid var(--bd);border-radius:12px;background:var(--glass2);backdrop-filter:blur(28px);box-shadow:0 10px 36px #0005;display:grid;gap:14px}
.tray-pop .control{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.tray-pop input[type=range]{width:130px;accent-color:var(--ac)}
.browser{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--glass)}
.browser .address{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--bd)}
.browser .address input{flex:1;min-width:0;border:1px solid var(--bd);border-radius:18px;background:var(--glass2);color:var(--tx);padding:8px 12px;font:13px inherit;outline:none}
.browser iframe{flex:1;border:0;background:white;width:100%}
.snap-hint{position:fixed;z-index:15000;top:8px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;background:var(--glass2);border:1px solid var(--bd);box-shadow:0 8px 30px #0005;font-size:13px;pointer-events:none}
.poweroff{position:fixed;inset:0;z-index:30000;background:#080b12;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.poweroff button{border:1px solid #ffffff55;background:#ffffff18;color:#fff;padding:10px 18px;border-radius:6px}
.file-icon{width:84px;padding:8px 4px;text-align:center;font-size:12px;border-radius:6px;color:#fff;text-shadow:0 1px 3px #000a;cursor:default}
.file-icon b{display:block;font-size:34px;font-weight:400}
.lock-screen{position:fixed;inset:0;z-index:20000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 2px 12px #0008;background:linear-gradient(135deg,rgba(5,20,55,.45),rgba(0,0,0,.18)),var(--lock-wall,linear-gradient(135deg,#0b1d4d,#1b6fd1 55%,#7fd0ff));background-size:cover;background-position:center;backdrop-filter:blur(2px);cursor:pointer}
.lock-screen .lock-time{font-size:clamp(64px,12vw,112px);font-weight:300;line-height:1.05;letter-spacing:-4px}
.lock-screen .lock-date{font-size:clamp(18px,3vw,26px);margin-top:8px}
.lock-screen .lock-hint{position:absolute;bottom:9%;font-size:14px;opacity:.9;animation:lockPulse 2s ease-in-out infinite}
.lock-screen .lock-unlock{margin-top:30px;padding:10px 24px;border:1px solid #ffffff80;border-radius:6px;background:#ffffff20;color:#fff;font:inherit;backdrop-filter:blur(12px);cursor:pointer}
@keyframes lockPulse{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.lock-screen .lock-hint{animation:none}}

.start .grid{overflow:auto;min-height:0;align-content:start;margin-bottom:10px}
.sys-btn{display:flex;align-items:center;gap:14px;height:40px;padding:0 12px;margin-right:80px;border:0;border-radius:6px;background:none;color:var(--tx)}
.sys-btn:hover,.sys-btn.act{background:var(--bd)}
.ico{display:inline-flex}
.qs{position:fixed;right:92px;bottom:60px;width:340px;z-index:10001;padding:20px;border-radius:12px;background:var(--glass2);backdrop-filter:blur(28px);border:1px solid var(--bd);box-shadow:0 10px 36px #0005;display:grid;gap:20px;animation:up .15s ease-out}
.qs-tile{display:flex;align-items:center;gap:12px;padding:12px 14px;width:150px;border-radius:6px;border:1px solid var(--bd);background:var(--glass);color:var(--tx);text-align:left;font-size:13px}
.qs-tile.on{background:var(--ac);border-color:var(--ac);color:#fff}
.qs-tile strong{display:block;font-weight:600}.qs-tile small{opacity:.85;font-size:11px}
.qs-vol{display:flex;align-items:center;gap:12px;font-size:12px}
.qs-vol input{flex:1;accent-color:var(--ac)}
.qs-vol .qs-mute{border:0;background:none;color:var(--tx);padding:4px;border-radius:4px}
.qs-vol .qs-mute:hover{background:var(--bd)}
.qs-vol span.n{width:28px;text-align:right}
.lock-screen .lock-status{position:absolute;right:28px;bottom:22px;display:flex;gap:18px}
.vbox{display:flex;flex-direction:column;flex:1;min-height:0}
.vb-tools{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--bd);background:var(--glass2)}
.vb-tools button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;padding:6px 10px;border:0;border-radius:6px;background:none;color:var(--tx);font-size:12px}
.vb-tools button .i{font-size:22px;line-height:1.1}
.vb-tools button:hover:not(:disabled){background:var(--bd)}.vb-tools button:disabled{opacity:.4}
.vb-main{display:flex;flex:1;min-height:0}
.vb-list{width:220px;flex:none;border-right:1px solid var(--bd);overflow:auto;padding:6px;background:var(--glass2);display:flex;flex-direction:column;gap:2px}
.vb-vm{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:6px;background:none;color:var(--tx);font-size:13px}
.vb-vm:hover{background:var(--bd)}.vb-vm.sel{background:var(--ac);color:#fff}
.vb-vm .i{font-size:26px}.vb-vm small{display:block;opacity:.75;font-size:11px}
.vb-detail{flex:1;min-width:0;padding:22px;overflow:auto;display:grid;gap:12px;align-content:start;font-size:13px}
.vb-detail .big{font-size:56px;line-height:1}
.vb-detail h3{font-size:20px;font-weight:600}
.vb-detail .kv{display:grid;grid-template-columns:110px 1fr;gap:6px;color:var(--mut)}.vb-detail .kv b{color:var(--tx);font-weight:400;word-break:break-all}
.vb-detail label{display:grid;gap:4px;color:var(--mut)}
.vb-detail input{padding:9px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--glass2);color:var(--tx);font:inherit;outline:none}
.vb-detail input:focus{border-color:var(--ac)}
.btabs{display:flex;align-items:flex-end;gap:2px;padding:6px 6px 0;background:var(--glass2);overflow-x:auto;flex:none}
.btab{display:flex;align-items:center;gap:6px;flex:0 1 180px;min-width:90px;padding:6px 6px 6px 12px;border-radius:8px 8px 0 0;font-size:12px;cursor:default}
.btab:hover{background:var(--bd)}.btab.sel{background:var(--glass)}
.btab .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btab .x{width:20px;height:20px;border:0;border-radius:4px;background:none;color:inherit;font-size:11px;flex:none}
.btab .x:hover{background:var(--bd)}
.btab-add{width:30px;height:28px;border:0;border-radius:6px;background:none;color:var(--tx);font-size:18px;flex:none;margin-bottom:2px}
.btab-add:hover{background:var(--bd)}
.np{display:flex;flex-direction:column;flex:1;min-height:0;position:relative;background:var(--glass)}
.np-bar{display:flex;padding:2px 4px;border-bottom:1px solid var(--bd);font-size:12px;background:var(--glass2);position:relative;flex:none}
.np-bar>div{position:relative}
.np-bar>div>button{border:0;background:none;color:var(--tx);padding:4px 10px;border-radius:4px;font-size:12px}
.np-bar>div>button:hover,.np-bar>div>button.on{background:var(--bd)}
.np-dd{position:absolute;top:100%;left:0;min-width:270px;z-index:6;background:var(--glass2);backdrop-filter:blur(30px);border:1px solid var(--bd);border-radius:8px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.np-dd hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
.np-mi{display:flex;width:100%;align-items:center;gap:6px;border:0;background:none;color:var(--tx);padding:6px 10px 6px 4px;border-radius:4px;font-size:12px;text-align:left}
.np-mi:hover:not(:disabled){background:var(--bd)}.np-mi:disabled{opacity:.4}
.np-mi .c{width:18px;text-align:center}.np-mi .l{flex:1}.np-mi .k{color:var(--mut);margin-left:24px}
.np-mi.lbl{color:var(--mut);font-size:11px;padding-left:22px}
.np textarea{padding:6px 8px;overflow:auto;min-height:0}
.np-status{display:flex;flex:none;font-size:12px;border-top:1px solid var(--bd);background:var(--glass2);color:var(--mut)}
.np-status span{padding:3px 12px;border-left:1px solid var(--bd);white-space:nowrap}
.np-status span:first-child{flex:1;border-left:0}
.np-ov{position:absolute;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:8}
.np-dlg{background:var(--glass2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:16px;box-shadow:0 10px 36px #0006;display:grid;gap:10px;font-size:13px;min-width:300px;max-width:92%;user-select:none}
.np-dlg label{display:grid;gap:4px}
.np-dlg input[type=text],.np-dlg input[type=number],.np-dlg input:not([type]),.np-dlg select{padding:6px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--glass);color:var(--tx);font:inherit;outline:none;width:100%}
.np-dlg label.ck{display:flex;align-items:center;gap:6px}
.np-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.np-prev{border:1px solid var(--bd);border-radius:5px;padding:12px;text-align:center;background:var(--glass)}
.np-find{position:absolute;top:34px;right:16px;z-index:7;width:340px}
.np-row{display:flex;gap:10px;align-items:center}
.cm{padding:4px;min-width:210px;border-radius:8px}
.cm hr{border:0;border-top:1px solid var(--bd);margin:4px 2px}
.cm-row{position:relative}
.cm .cm-i{display:flex;align-items:center;gap:12px;padding:7px 10px;font-size:12.5px;border-radius:4px}
.cm-i .ic{width:18px;text-align:center;font-size:14px}.cm-i .l{flex:1}.cm-i .ch{opacity:.7;font-size:16px;line-height:1}
.cm-i.dis{opacity:.4}
.cm-sub{position:absolute;left:100%;top:-5px;margin-left:2px;min-width:200px}
.cm-sub.flip{left:auto;right:100%;margin-left:0;margin-right:2px}
.icons.sz-l{grid-template-rows:repeat(auto-fill,118px)}.icons.sz-l .icon{width:108px}.icons.sz-l .icon b{font-size:50px}
.icons.sz-s{grid-template-rows:repeat(auto-fill,72px)}.icons.sz-s .icon{width:72px;font-size:11px;padding:4px}.icons.sz-s .icon b{font-size:24px}
.lock-sys{position:absolute;right:24px;bottom:20px;display:flex;gap:16px;padding:10px 14px;border:0;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(12px);cursor:pointer}
.lock-sys:hover{background:rgba(255,255,255,.22)}
.lock-screen .qs{text-shadow:none;color:var(--tx);cursor:default}
.icon.sel{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
.clip{padding:12px;display:grid;gap:8px;align-content:start;font-size:13px}
.clip-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.clip-item{padding:10px 12px;border-radius:8px;background:var(--glass2);border:1px solid var(--bd);display:grid;gap:6px;cursor:pointer}
.clip-item:hover{border-color:var(--ac)}
.clip-t{white-space:pre-wrap;word-break:break-word;max-height:5.4em;overflow:hidden}
.clip-meta{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:11px}
.clip-meta button{border:0;background:none;color:var(--tx);border-radius:4px;padding:2px 6px;font-size:13px;opacity:.75}
.clip-meta button:hover{background:var(--bd);opacity:1}

.clock{cursor:default}.clock.act{background:var(--bd)}
.toasts{position:fixed;right:12px;bottom:60px;z-index:10050;display:flex;flex-direction:column;gap:10px;pointer-events:none;align-items:flex-end}
.toast{pointer-events:auto;width:340px;display:flex;gap:12px;padding:14px;border-radius:8px;background:var(--glass2);backdrop-filter:blur(30px);border:1px solid var(--bd);box-shadow:0 10px 36px #0006;animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:slideOut .3s ease-in forwards}
.toast .ti{font-size:26px;line-height:1}
.toast .tx{flex:1;font-size:12.5px;color:var(--mut)}
